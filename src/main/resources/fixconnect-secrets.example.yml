# FixConnect AI - template for the private settings file.
# Copy this file to src/main/resources/fixconnect-secrets.yml and fill in your own values.
# (The real file is kept out of GitHub. On Render, add it under Environment -> Secret Files.)
spring:
  datasource:
    url: jdbc:postgresql://<host>:5432/postgres?sslmode=require
    username: <database-user>
    password: <database-password>
  mail:
    username: <gmail-address>
    password: <gmail-app-password>

fixconnect:
  mail:
    brevo-api-key: <brevo-api-key-or-empty>
  jwt:
    secret: <any-long-random-text-at-least-32-characters>
